[project]
name = "paper-review-openenv"
version = "0.1.0"
description = "OpenEnv research paper review environment"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
environment = "environment:PaperReviewEnv"
name: paper-review-env

description: >
  Environment where an AI agent reviews research paper abstracts,
  classifies domain, extracts keywords, and recommends acceptance decisions.

version: 1.0

entrypoint: environment:PaperReviewEnv

tasks:
  - name: domain_classification_easy
    difficulty: easy

  - name: keyword_extraction_medium
    difficulty: medium

  - name: acceptance_decision_hard
    difficulty: hard

observation_space:
  abstract: string
  task_type: string

action_space:
  domain: string
  keywords: list
  decision: string

reward:
  type: float
  min: 0.0
  max: 1.0